; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp_wroom_02]
platform = espressif32
#board = esp32dev
board = az-delivery-devkit-v4
monitor_speed = 115200
monitor_filters = time
upload_speed = 460800
upload_port = /dev/cu.usbserial-14110
monitor_port = /dev/cu.usbserial-14110
framework = arduino
board_build.f_cpu = 240000000L
; board_build.partitions = min_spiffs.csv
; lib/ task modules (ScaleTask, DosingTask, ...) include "defines.h" for pin
; assignments; PlatformIO only adds the project include/ dir automatically
; to the src build, not to lib builds under chain LDF, hence this.
build_flags =
    -Iinclude
lib_deps =
    ArduinoJson
    https://github.com/tzapu/WiFiManager.git#v2.0.16-rc.2
    esphome/ESPAsyncWebServer-esphome@^3.1.0
    esphome/AsyncTCP-esphome@2.0.1
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0

; Host-native test environment: no Arduino framework, no ESP32 toolchain.
; Exists so pure-logic lib/ modules (DosingModel and friends) can have real
; unit tests that run on the dev machine, per AGENTS.md's process
; expectations for pure-logic modules.
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
test_framework = unity
test_filter = test_*
; Every other lib/ module pulls in Arduino/ESPAsyncWebServer headers that
; don't exist for a host build -- only DosingModel is host-buildable today.
lib_ignore =
    API
    Display
    RawDataWebSocket
    WebSocketSettings
    WebSocketGraph
    WebSocketLogger
    WebSocketMetrics

[env:esp_wroom_02_ota]
platform = espressif32
#board = esp32dev
board = az-delivery-devkit-v4
monitor_speed = 115200
monitor_filters = time
upload_protocol = espota
upload_port = 192.168.0.118
monitor_port = /dev/cu.usbserial-11420
framework = arduino
board_build.f_cpu = 240000000L
; board_build.partitions = min_spiffs.csv
lib_deps =
    ArduinoJson
    https://github.com/tzapu/WiFiManager.git#v2.0.16-rc.2
    esphome/ESPAsyncWebServer-esphome@^3.1.0
    esphome/AsyncTCP-esphome@2.0.1
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0