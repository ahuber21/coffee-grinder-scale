; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; data_dir is a project-wide option, not a per-env one. It points at the SPA's build output
; (webapp/dist), so `pio run -t buildfs` packages Vite's output directly.
[platformio]
data_dir = webapp/dist

[env:esp_wroom_02]
platform = espressif32
board = az-delivery-devkit-v4
monitor_speed = 115200
monitor_filters = time
upload_speed = 460800
upload_port = /dev/cu.usbserial-14110
monitor_port = /dev/cu.usbserial-14110
framework = arduino
board_build.f_cpu = 240000000L
board_build.filesystem = littlefs
; The lib/ task modules include "defines.h", and PlatformIO adds include/ to src builds only.
build_flags =
    -Iinclude
lib_deps =
    ArduinoJson
    https://github.com/tzapu/WiFiManager.git#v2.0.16-rc.2
    esphome/ESPAsyncWebServer-esphome@^3.1.0
    esphome/AsyncTCP-esphome@2.0.1
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0

; Host-native test environment (no Arduino or ESP32 toolchain) for the pure-logic modules.
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE -Ilib/Messaging -Ilib/DosingModel
test_framework = unity
test_filter = test_*
; The other lib/ modules need Arduino or ESPAsyncWebServer headers. DosingModel is built from
; lib/; Messaging's header-only SettingsSchema.h is reached through -Ilib/Messaging.
lib_ignore =
    ADS1232
    DisplayTask
    DosingTask
    InputTask
    Messaging
    NetworkTask
    ScaleTask
    SettingsTask
    TelemetryTask

; Same firmware, flashed over WiFi (espota, no password).
[env:esp_wroom_02_ota]
extends = env:esp_wroom_02
upload_protocol = espota
upload_port = eureka.local
